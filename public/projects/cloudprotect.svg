<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <ellipse cx="600" cy="520" rx="400" ry="80" fill="#0ea5e9" opacity="0.06"/>
  <!-- Central hub -->
  <circle cx="600" cy="320" r="70" fill="#0f172a" stroke="#5eead4" stroke-width="3"/>
  <text x="600" y="318" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Cloud</text>
  <text x="600" y="340" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="13">Protect</text>
  <!-- AWS cloud -->
  <g transform="translate(280,200)">
    <path d="M0 60 Q30 20 70 40 Q90 0 130 30 Q160 10 180 50 Q200 45 190 70 Q210 90 170 85 Q150 110 110 95 Q70 115 50 90 Q10 100 0 60Z" fill="url(#cloud)" opacity="0.85"/>
    <text x="95" y="130" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="15" font-weight="600">AWS</text>
    <line x1="95" y1="115" x2="520" y2="280" stroke="#5eead4" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4"/>
  </g>
  <!-- Azure cloud -->
  <g transform="translate(820,180)">
    <path d="M0 55 Q25 15 65 35 Q85 5 120 28 Q145 8 165 48 Q185 42 175 68 Q195 85 158 80 Q138 102 100 88 Q62 108 42 82 Q5 92 0 55Z" fill="#38bdf8" opacity="0.75"/>
    <text x="82" y="125" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="15" font-weight="600">Azure</text>
    <line x1="82" y1="110" x2="-220" y2="260" stroke="#67e8f9" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4"/>
  </g>
  <!-- Service blocks -->
  <rect x="180" y="420" width="100" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="230" y="455" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="12">EC2</text>
  <rect x="320" y="440" width="100" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="370" y="475" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="12">IAM</text>
  <rect x="780" y="430" width="100" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="830" y="465" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="12">Redis</text>
  <rect x="920" y="450" width="100" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="970" y="485" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="12">Mongo</text>
  <!-- Report panel -->
  <rect x="420" y="480" width="360" height="120" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="450" y="520" fill="#5eead4" font-family="system-ui" font-size="14" font-weight="600">Multi-tenant Report</text>
  <rect x="450" y="540" width="280" height="8" rx="4" fill="#1e293b"/>
  <rect x="450" y="540" width="200" height="8" rx="4" fill="#2dd4bf"/>
</svg>
